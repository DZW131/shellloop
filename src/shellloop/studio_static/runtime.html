<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>运行观测台 · Shellloop Studio</title><link rel="stylesheet" href="style.css"></head>
  <body>
    <header class="topbar"><div class="brand"><span class="brand-mark">S/</span>运行观测台</div><nav class="nav"><a href="index.html">概览</a><a class="active" href="runtime.html">运行观测台</a><a href="evolution.html">演化工作台</a></nav></header>
    <main>
      <p class="eyebrow">Runtime Observatory</p><h1>每一个真实状态，都能被看见。</h1><p class="lead">模型 API 在本地 Studio 进程中调用；模型生成的命令只会进入一次性、无网络的 Docker 会话副本。</p>
      <div class="status-row" id="sandbox-status"></div>
      <section class="grid runtime">
        <form class="panel" id="run-form"><div class="panel-head"><h2>开始隔离运行</h2><span>密钥仅用于本次请求</span></div>
          <label>Provider<select id="provider"><option value="ollama-cloud">Ollama Cloud</option><option value="openai-compatible">OpenAI-compatible</option></select></label>
          <label>API Base<input id="api-base" value="https://ollama.com/api" required></label><label>Model<input id="model" placeholder="例如 gpt-oss:120b-cloud" required></label><label>API Key<input id="api-key" type="password" autocomplete="off" required></label><label>任务<textarea id="task" placeholder="例如：检查当前项目的测试，并只执行一个安全的诊断命令。" required></textarea></label>
          <button class="button" id="run-button">启动受限运行</button><p class="hint">不会使用宿主机 shell；没有 Docker 时按钮不可用。</p><p class="message" id="run-message"></p>
        </form>
        <section class="panel timeline-panel"><div class="panel-head"><h2>事实事件时间线</h2><span id="event-count">尚未开始</span></div><div class="timeline" id="timeline"><div class="empty">提交一个真实 API 任务后，事件会在这里实时出现。</div></div></section>
        <aside class="panel"><div class="panel-head"><h2>当前状态</h2><span>只读摘要</span></div><div class="state-list" id="state-list"><div class="state"><small>运行</small><b>等待任务</b></div><div class="state"><small>沙箱</small><b>尚未创建</b></div><div class="state"><small>最后事件</small><b>—</b></div></div></aside>
      </section>
    </main><script src="runtime.js"></script>
  </body>
</html>
