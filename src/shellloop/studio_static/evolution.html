<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>演化工作台 · Shellloop Studio</title><link rel="stylesheet" href="style.css"></head>
  <body>
    <header class="topbar"><div class="brand"><span class="brand-mark">S/</span>演化工作台</div><nav class="nav"><a href="index.html">概览</a><a href="runtime.html">运行观测台</a><a class="active" href="evolution.html">演化工作台</a></nav></header>
    <main>
      <p class="eyebrow">Harness Evolution Workbench</p><h1>先提出证据，再批准改进。</h1><p class="lead">第一版只允许改动明确白名单中的 Harness 字段：系统提示词、最大步数和命令超时。模型不能直接写入活跃项目。</p>
      <div class="flow" id="flow"><div class="flow-node active">自然语言需求</div><div class="flow-node">候选 Harness</div><div class="flow-node">Docker 验证</div><div class="flow-node">人工批准</div><div class="flow-node">新版本</div></div>
      <section class="grid evolution">
        <form class="panel" id="proposal-form"><div class="panel-head"><h2>提出改进需求</h2><span>不会执行命令</span></div>
          <label>Provider<select id="provider"><option value="ollama-cloud">Ollama Cloud</option><option value="openai-compatible">OpenAI-compatible</option></select></label><label>API Base<input id="api-base" value="https://ollama.com/api" required></label><label>Model<input id="model" placeholder="例如 gpt-oss:120b-cloud" required></label><label>API Key<input id="api-key" type="password" autocomplete="off" required></label><label>希望怎样改进 Harness？<textarea id="request" placeholder="例如：把系统提示词改得更适合初学者，并将最大步数限制得更保守。" required></textarea></label>
          <button class="button" id="proposal-button">生成候选方案</button><p class="hint">密钥只在本次 API 请求中使用，浏览器不会本地保存。</p><p class="message" id="proposal-message"></p>
        </form>
        <section class="panel"><div class="panel-head"><h2>改造对比与验证</h2><span id="proposal-status">等待候选方案</span></div><p class="proposal-summary" id="proposal-summary">当前 Harness 将在这里与候选版本对比。</p><div class="diff" id="diff"><div class="empty">先输入自然语言需求，生成受约束的候选改造。</div></div><div class="hero-actions" style="margin-top:1rem"><button class="button secondary" id="verify-button" disabled>在 Docker 中验证</button><button class="button success" id="apply-button" disabled>批准并应用</button></div></section>
      </section>
    </main><script src="evolution.js"></script>
  </body>
</html>
