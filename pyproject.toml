[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellloop"
version = "0.5.0"
description = "A local-first, observable and evolvable Agent Harness Studio."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DZW131" }]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
shellloop = "shellloop.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shellloop = ["studio_static/*.css", "studio_static/*.html", "studio_static/*.js"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
